schema: arr-orchestrator.desired-state.v1
stack_id: synthetic-home-lab
policy:
  plan_required: true
  verify_after_apply: true
  destructive_operations: deny
runtime:
  config_dir: ${XDG_CONFIG_HOME}/arr-orchestrator
  data_dir: ${XDG_DATA_HOME}/arr-orchestrator
services:
  sonarr:
    url_env: ARR_ORCHESTRATOR_SONARR_URL
    api_key_env: ARR_ORCHESTRATOR_SONARR_API_KEY
    root_folder: /media/tv
    download_category: tv
  radarr:
    url_env: ARR_ORCHESTRATOR_RADARR_URL
    api_key_env: ARR_ORCHESTRATOR_RADARR_API_KEY
    root_folder: /media/movies
    download_category: movies
  prowlarr:
    url_env: ARR_ORCHESTRATOR_PROWLARR_URL
    api_key_env: ARR_ORCHESTRATOR_PROWLARR_API_KEY
storage:
  downloads_root: /data/downloads
  media_root: /data/media
  hardlinks: required
