[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arr-orchestrator"
version = "0.2.0.dev0"
description = "Agent-first control plane for safe orchestration of an existing *arr stack"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Viggo Meesters" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.scripts]
arrctl = "arr_orchestrator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
